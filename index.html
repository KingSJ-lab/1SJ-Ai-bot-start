<!DOCTYPE html>
<html>
<head>
  <title>SJ Bill Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-6">
  <h1 class="text-3xl font-bold">Dashboard</h1>
  <p class="mt-2 text-gray-400">Welcome John Doe</p>
  
  <div class="grid grid-cols-3 gap-3 mt-6">
    <button class="bg-green-500 hover:bg-green-600 px-4 py-3 rounded-lg">Airtime</button>
    <button class="bg-yellow-500 hover:bg-yellow-600 px-4 py-3 rounded-lg">NEPA</button>
    <button class="bg-red-500 hover:bg-red-600 px-4 py-3 rounded-lg">DSTV</button>
  </div>
  
  <h2 class="text-xl font-semibold mt-8">History</h2>
  <div class="mt-2 text-gray-400">No bills yet</div>
</body>
</html>
